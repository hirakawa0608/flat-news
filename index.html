      --flat-ink: #F5ECE3;
      --flat-ink-soft: #C9B8AC;

    --flat-cream: #221A15;
    --flat-ink: #F5ECE3;
    --flat-ink-soft: #C9B8AC;
    --flat-line: #3A2C22;
    --flat-card: #2B221B;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--flat-cream);
    color: var(--flat-ink);

    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  img, svg { max-width: 100%; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Header ---------- */
  header.site {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--flat-white);
    border-bottom: 1px solid var(--flat-line);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .logo {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 1.7rem;
    color: var(--flat-orange);
    text-decoration: none;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  nav.pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-end;
  }
  nav.pills a {
    display: inline-block;
    padding: 9px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--flat-orange);
    color: var(--flat-orange-deep);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  nav.pills a:hover { background: var(--flat-orange-tint); }
  nav.pills a.current {
    background: var(--flat-orange);
    color: var(--flat-white);
    font-weight: 700;
  }
  @media (max-width: 860px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
    nav.pills { justify-content: flex-start; }
    nav.pills a { padding: 7px 14px; font-size: 0.8rem; }
  }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(160deg, var(--flat-orange) 0%, var(--flat-orange-deep) 100%);
    color: var(--flat-white);
    padding: 64px 0 56px;
  }
  .hero-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .hero .eyebrow {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--flat-yellow);
    margin: 0 0 10px;
  }
  .hero h1 {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: clamp(2.1rem, 5vw, 3rem);
    margin: 0 0 16px;
    line-height: 1.3;
  }
  .hero p.lead {
    max-width: 560px;
    font-size: 1rem;
    color: #FFE9DA;
    margin: 0 0 28px;
  }
  .hero .updated {
    font-size: 0.88rem;
    color: #FFE9DA;
    margin: 0;
  }

  /* ---------- News list ---------- */
  main { padding: 20px 0 100px; }

  .month-group { display: flex; gap: 32px; padding: 40px 0; border-bottom: 1px solid var(--flat-line); }
  .month-group:first-child { padding-top: 28px; }

  .month-label {
    flex-shrink: 0;
    width: 108px;
    position: sticky;
    top: 92px;
    align-self: flex-start;
  }
  .month-label .year { font-size: 0.8rem; color: var(--flat-ink-soft); display: block; }
  .month-label .month {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    color: var(--flat-orange-deep);
    display: block;
    line-height: 1.1;
  }

  .items { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .item {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 14px;
    align-items: baseline;
    padding: 14px 0;
    border-top: 1px solid var(--flat-line);
  }
  .items .item:first-child { border-top: none; padding-top: 0; }

  .item .day {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--flat-ink-soft);
  }

  .item .text-wrap a, .item .text-wrap span.plain {
    text-decoration: none;
    color: var(--flat-ink);
    font-size: 0.96rem;
    font-weight: 500;
  }
  .item .text-wrap a {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  .item .text-wrap a:hover { color: var(--flat-orange-deep); text-decoration: underline; text-underline-offset: 3px; }
  .item .text-wrap a svg { width: 12px; height: 12px; flex-shrink: 0; align-self: center; opacity: 0.6; }

  @media (max-width: 640px) {
    .month-group { gap: 16px; padding: 28px 0; }
    .month-label { width: 64px; position: static; }
    .month-label .month { font-size: 1.3rem; }
    .item { grid-template-columns: 30px 1fr; }
  }

  .empty-state {
    padding: 60px 24px;
    text-align: center;
    color: var(--flat-ink-soft);
  }

  footer.site {
    background: var(--flat-ink);
    color: #E9DED4;
    padding: 40px 0;
    text-align: center;
    font-size: 0.82rem;
  }
  footer.site a { color: var(--flat-yellow); text-decoration: none; }
  footer.site a:hover { text-decoration: underline; }
</style>

const ICONS = {
  external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>'
};

const DATA = RAW.map(([y, m, d, text, url]) => ({ y, m, d, text, url }))
  .sort((a, b) => (b.y - a.y) || (b.m - a.m) || (b.d - a.d));

function renderStats() {
  const latest = DATA[0];
  document.getElementById("statLatest").textContent = `${latest.y}年${latest.m}月${latest.d}日`;
}

function renderList() {
  const root = document.getElementById("listRoot");

  const groups = [];
  let currentKey = null;
  DATA.forEach(item => {
    const key = `${item.y}-${item.m}`;
    if (key !== currentKey) {
      groups.push({ y: item.y, m: item.m, items: [] });
      currentKey = key;
    }
    groups[groups.length - 1].items.push(item);
  });

  root.innerHTML = groups.map(g => `
    <div class="month-group">
      <div class="month-label">
        <span class="year">${g.y}</span>
        <span class="month">${g.m}月</span>
      </div>
      <div class="items">
        ${g.items.map(item => {
          const body = item.url
            ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.text)}${ICONS.external}</a>`
            : `<span class="plain">${escapeHtml(item.text)}</span>`;
          return `
            <div class="item">
              <div class="day">${item.d}日</div>
              <div class="text-wrap">${body}</div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `).join("");
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

renderStats();
renderList();
</script>
